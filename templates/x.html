<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Notice | Service Disruption</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #f59e0b;
            --accent-hover: #d97706;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Animated Main Warning Icon */
        .icon-container {
            font-size: 64px;
            color: var(--accent-color);
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 0px rgba(245, 158, 11, 0));
            }
            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.6));
            }
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 0px rgba(245, 158, 11, 0));
            }
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* Status Badge with Live Pulsing Dot */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 25px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Interactive Button with Spinning Icon on Hover */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:hover i {
            transform: rotate(180deg);
        }

        .btn i {
            transition: transform 0.5s ease;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Font Awesome Animated Warning Icon -->
        <div class="icon-container">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div>
            <span class="status-badge">
                <span class="dot-pulse"></span>
                Service Interruption
            </span>
        </div>

        <h1>Server Discontent Notice</h1>
        <p>We are currently experiencing unexpected server discontent and performance issues. Our engineering team is looking into the matter to restore full functionality as soon as possible.</p>
        
        <!-- Button with Font Awesome Refresh Icon -->
        <a href="javascript:window.location.reload();" class="btn">
            <i class="fa-solid fa-rotate-right"></i> Try Again
        </a>

        <div class="footer-text">
            Thank you for your patience and understanding.
        </div>
    </div>

</body>
</html>
